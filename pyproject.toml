[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realwaste-mlops"
version = "0.1.0"
description = "RealWaste image classification project with MLflow, DVC, FastAPI, Gradio, and automated tests."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Pritam Wani" }
]
dependencies = [
  "dvc>=3.60.0",
  "fastapi[standard]>=0.115.0",
  "gradio>=5.0.0",
  "mlflow>=2.20.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pillow>=10.4.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.6.0",
  "tensorflow>=2.18.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "--strict-markers",
  "--cov=realwaste_mlops",
  "--cov-report=term-missing"
]
markers = [
  "integration: integration tests",
  "slow: slower-running tests"
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
